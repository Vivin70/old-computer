<!DOCTYPE html>
<html>
<head>
    <title>View Users</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<h3>Registered Users</h3>

<table border="1">
<tr>
    <th>ID</th><th>Name</th><th>Email</th><th>Role</th>
</tr>

{% for u in users %}
<tr>
    <td>{{u.user_id}}</td>
    <td>{{u.name}}</td>
    <td>{{u.email}}</td>
    <td>{{u.role}}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
